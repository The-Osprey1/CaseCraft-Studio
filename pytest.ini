[pytest]
# Fast tests:  pytest -m "not slow"     (parameter rules, 2D checks, 3MF validator, API errors)
# Full suite:  pytest                   (adds full B-rep generation and export verification)
python_files = test_*.py
testpaths = .
markers =
    slow: builds full case geometry / export bundles (minutes)
filterwarnings =
    ignore::DeprecationWarning
